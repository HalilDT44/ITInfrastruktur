apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: waf
  namespace: zendo
  labels:
    app.kubernetes.io/part-of: zendo
    app.kubernetes.io/name: waf
    app.kubernetes.io/version: 1.0.0
    tier: edge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waf
  minReplicas: 8
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
