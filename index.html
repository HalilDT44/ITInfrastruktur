<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zendo · Projektverwaltung</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#"><span class="brand-mark">z</span>ZENDO<span class="brand-dot">®</span></a>
    <div class="nav-label">ÜBERSICHT</div>
    <nav><button data-view="dashboard"><span>◫</span> Dashboard</button><button data-view="tasks"><span>☷</span> Alle Aufgaben <small id="task-count"></small></button></nav>
    <div class="nav-label workspace-label">ARBEITSBEREICH <button id="add-project" title="Projekt erstellen" aria-label="Projekt erstellen">＋</button></div>
    <div id="project-nav"></div>
    <div class="nav-label">WERKZEUGE</div><nav><button data-view="reports"><span>▤</span> Berichte & PDF</button></nav>
    <div class="sidebar-bottom"><div class="local-note"><span class="local-dot"></span> Dein Projektarbeitsbereich<p>Alles an einem Ort. Ganz ohne Login.</p></div><div class="profile"><div class="avatar">DU</div><div><strong>Mein Workspace</strong><small>Persönlicher Arbeitsbereich</small></div></div></div>
  </aside>
  <main>
    <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="top-title">Dashboard</strong></div><div class="top-actions"><span class="saved"><i></i> Verbindung wird aufgebaut</span><button class="primary" id="new-task">＋ Neue Aufgabe</button></div></header>
    <div class="content"><div id="connection-error" role="alert" hidden></div>
      <section class="page-heading"><div><div class="eyebrow" id="eyebrow">DEIN ARBEITSBEREICH</div><h1 id="page-title"></h1><p id="page-description"></p></div><div id="heading-actions"></div></section>
      <div id="stats" class="stats"></div>
      <section id="workspace"></section>
      <footer><span><span class="local-dot"></span> Zentral auf dem Server gespeichert</span><span>Weniger organisieren. Mehr erreichen.</span></footer>
    </div>
  </main>
</div>
<dialog id="editor"><form id="editor-form"></form></dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body></html>
