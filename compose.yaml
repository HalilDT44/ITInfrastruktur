services:
  web:
    build: .
    ports:
      - "127.0.0.1:${ZENDO_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DB_HOST: db
      REPORT_DELAY_SECONDS: "2"
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge, data]
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: zendo
      POSTGRES_DB: zendo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db-data:/var/lib/postgresql/data]
    tmpfs: [/var/run/postgresql, /tmp]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zendo -d zendo"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped
secrets:
  db_password:
    file: .secrets/db_password
volumes:
  db-data:
networks:
  edge:
  data:
    internal: true
