    {
      "apiVersion": "batch/v1",
      "kind": "CronJob",
      "metadata": {
        "name": "backup",
        "labels": {
          "app.kubernetes.io/part-of": "zendo",
          "app.kubernetes.io/name": "backup",
          "app.kubernetes.io/version": "1.0.0",
          "tier": "ops"
        },
        "namespace": "zendo"
      },
      "spec": {
        "schedule": "0 */6 * * *",
        "concurrencyPolicy": "Forbid",
        "successfulJobsHistoryLimit": 2,
        "failedJobsHistoryLimit": 3,
        "jobTemplate": {
          "spec": {
            "template": {
              "metadata": {
                "labels": {
                  "app.kubernetes.io/part-of": "zendo",
                  "app.kubernetes.io/name": "backup",
                  "app.kubernetes.io/version": "1.0.0",
                  "tier": "data"
                }
              },
              "spec": {
                "restartPolicy": "OnFailure",
                "automountServiceAccountToken": false,
                "securityContext": {
                  "runAsUser": 70,
                  "runAsNonRoot": true,
                  "fsGroup": 70
                },
                "containers": [
                  {
                    "name": "backup",
                    "image": "postgres:17-alpine",
                    "command": [
                      "sh",
                      "-ec",
                      "export PGPASSWORD=\"$(cat /run/secrets/db_password)\"; file=/backups/zendo-$(date -u +%Y%m%dT%H%M%SZ).dump; pg_dump -h db -U zendo -d zendo -Fc -f \"$file.tmp\"; mv \"$file.tmp\" \"$file\"; find /backups -name \"*.dump\" -mtime +7 -delete"
                    ],
                    "resources": {
                      "requests": {
                        "cpu": "100m",
                        "memory": "128Mi"
                      },
                      "limits": {
                        "cpu": "1",
                        "memory": "512Mi"
                      }
                    },
                    "securityContext": {
                      "allowPrivilegeEscalation": false,
                      "readOnlyRootFilesystem": true,
                      "capabilities": {
                        "drop": [
                          "ALL"
                        ]
                      }
                    },
                    "volumeMounts": [
                      {
                        "name": "backup",
                        "mountPath": "/backups"
                      },
                      {
                        "name": "password",
                        "mountPath": "/run/secrets",
                        "readOnly": true
                      }
                    ]
                  }
                ],
                "volumes": [
                  {
                    "name": "backup",
                    "persistentVolumeClaim": {
                      "claimName": "backups"
                    }
                  },
                  {
                    "name": "password",
                    "secret": {
                      "secretName": "db-secret",
                      "defaultMode": 292
                    }
                  }
                ]
              }
            }
          }
        }
      }
    },
