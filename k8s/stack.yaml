    {
      "apiVersion": "apps/v1",
      "kind": "StatefulSet",
      "metadata": {
        "name": "db",
        "labels": {
          "app.kubernetes.io/part-of": "zendo",
          "app.kubernetes.io/name": "db",
          "app.kubernetes.io/version": "1.0.0",
          "tier": "data"
        },
        "namespace": "zendo"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "zendo",
              "app.kubernetes.io/name": "db",
              "app.kubernetes.io/version": "1.0.0",
              "tier": "data"
            }
          },
          "spec": {
            "enableServiceLinks": false,
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 75,
            "securityContext": {
              "fsGroup": 70
            },
            "containers": [
              {
                "name": "db",
                "image": "postgres:17-alpine",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 5432,
                    "name": "http"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "256Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 70,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "livenessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "pg_isready -U zendo -d zendo"
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5
                },
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "sh",
                      "-c",
                      "PGPASSWORD=\"$(cat /run/secrets/db_password)\" psql -h 127.0.0.1 -U zendo -d zendo -tAc \"SELECT 1\""
                    ]
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5
                },
                "env": [
                  {
                    "name": "POSTGRES_USER",
                    "value": "zendo"
                  },
                  {
                    "name": "POSTGRES_DB",
                    "value": "zendo"
                  },
                  {
                    "name": "POSTGRES_PASSWORD_FILE",
                    "value": "/run/secrets/db_password"
                  },
                  {
                    "name": "PGDATA",
                    "value": "/var/lib/postgresql/data/pgdata"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  },
                  {
                    "name": "password",
                    "mountPath": "/run/secrets",
                    "readOnly": true
                  },
                  {
                    "name": "run",
                    "mountPath": "/var/run/postgresql"
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "db-data"
                }
              },
              {
                "name": "password",
                "secret": {
                  "secretName": "db-secret",
                  "defaultMode": 292
                }
              },
              {
                "name": "run",
                "emptyDir": {}
              },
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ]
          }
        },
        "serviceName": "db"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "db",
        "labels": {
          "app.kubernetes.io/part-of": "zendo",
          "app.kubernetes.io/name": "db",
          "app.kubernetes.io/version": "1.0.0",
          "tier": "ops"
        },
