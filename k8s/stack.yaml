                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "web-config"
                }
              },
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ]
          }
        },
        "strategy": {
          "type": "RollingUpdate",
          "rollingUpdate": {
            "maxUnavailable": 0,
            "maxSurge": 1
