    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "api",
        "labels": {
          "app.kubernetes.io/part-of": "zendo",
          "app.kubernetes.io/name": "api",
          "app.kubernetes.io/version": "1.0.0",
          "tier": "backend"
        },
        "namespace": "zendo"
      },
      "spec": {
        "replicas": 2,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "api"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "zendo",
              "app.kubernetes.io/name": "api",
              "app.kubernetes.io/version": "1.0.0",
              "tier": "backend"
            }
          },
          "spec": {
            "enableServiceLinks": false,
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 75,
            "securityContext": {
              "fsGroup": 10001
            },
            "containers": [
              {
                "name": "api",
                "image": "zendo-api:1.0.0",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8000,
                    "name": "http"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "250m",
                    "memory": "192Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "512Mi"
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 10001,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/api/live",
                    "port": 8000
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/api/ready",
                    "port": 8000
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3
                },
                "volumeMounts": [
                  {
                    "name": "password",
                    "mountPath": "/run/secrets",
                    "readOnly": true
                  },
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  }
                ],
                "envFrom": [
                  {
                    "configMapRef": {
                      "name": "app-config"
                    }
                  }
                ],
                "lifecycle": {
                  "preStop": {
                    "exec": {
                      "command": [
                        "python",
                        "-c",
                        "import time; time.sleep(10)"
                      ]
                    }
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/api/live",
                    "port": 8000
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 30
                }
              }
            ],
            "volumes": [
              {
                "name": "password",
                "secret": {
                  "secretName": "db-secret",
                  "defaultMode": 292
                }
              },
              {
                "name": "tmp",
                "emptyDir": {}
              }
            ],
            "topologySpreadConstraints": [
              {
                "maxSkew": 1,
                "topologyKey": "kubernetes.io/hostname",
                "whenUnsatisfiable": "ScheduleAnyway",
                "labelSelector": {
                  "matchLabels": {
                    "app.kubernetes.io/name": "api"
                  }
                }
              }
            ]
          }
        },
        "strategy": {
          "type": "RollingUpdate",
          "rollingUpdate": {
            "maxUnavailable": 0,
            "maxSurge": 1
          }
        },
        "minReadySeconds": 5
      }
    },
