    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "waf-config",
        "labels": {
          "app.kubernetes.io/part-of": "zendo",
          "app.kubernetes.io/name": "waf-config",
          "app.kubernetes.io/version": "1.0.0",
          "tier": "ops"
        },
        "namespace": "zendo"
      },
      "data": {
        "REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf": "SecRule REQUEST_URI \"@streq /api/submissions\" \"id:1001,phase:1,pass,nolog,ctl:requestBodyAccess=Off\"\n",
        "proxy_backend.conf.template": "proxy_http_version 1.1;\nproxy_set_header Host $host;\nproxy_set_header Connection \"\";\nproxy_request_buffering off;\nproxy_buffering off;\nproxy_connect_timeout 10s;\nproxy_send_timeout 300s;\nproxy_read_timeout 300s;\nproxy_pass http://web:8080;\n"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "waf",
        "labels": {
          "app.kubernetes.io/part-of": "zendo",
          "app.kubernetes.io/name": "waf",
          "app.kubernetes.io/version": "1.0.0",
          "tier": "edge"
        },
        "namespace": "zendo"
      },
      "spec": {
        "replicas": 2,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "waf"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/part-of": "zendo",
              "app.kubernetes.io/name": "waf",
              "app.kubernetes.io/version": "1.0.0",
              "tier": "edge"
            }
          },
          "spec": {
            "enableServiceLinks": false,
            "automountServiceAccountToken": false,
            "terminationGracePeriodSeconds": 75,
            "securityContext": {
              "fsGroup": 101
            },
            "containers": [
              {
                "name": "waf",
                "image": "owasp/modsecurity-crs:nginx",
                "imagePullPolicy": "IfNotPresent",
                "ports": [
                  {
                    "containerPort": 8080,
                    "name": "http"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "200m",
                    "memory": "256Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "1Gi"
                  }
                },
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 101,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "livenessProbe": {
                  "tcpSocket": {
                    "port": 8080
                  },
                  "periodSeconds": 10
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/ready",
                    "port": 8080
                  },
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 3
                },
                "env": [
                  {
                    "name": "CLIENT_BODY_TIMEOUT",
                    "value": "300s"
                  },
                  {
                    "name": "ALLOWED_METHODS",
                    "value": "GET HEAD POST OPTIONS PUT"
                  },
                  {
                    "name": "ALLOWED_REQUEST_CONTENT_TYPE",
                    "value": "|application/json| |application/octet-stream|"
                  },
                  {
                    "name": "BACKEND",
                    "value": "http://web:8080"
                  },
                  {
                    "name": "PORT",
                    "value": "8080"
                  },
                  {
                    "name": "MODSEC_RULE_ENGINE",
                    "value": "On"
                  },
                  {
                    "name": "MODSEC_REQ_BODY_LIMIT",
                    "value": "6291456"
                  },
                  {
                    "name": "MODSEC_REQ_BODY_NOFILES_LIMIT",
                    "value": "6291456"
                  },
                  {
                    "name": "MODSEC_REQ_BODY_LIMIT_ACTION",
                    "value": "Reject"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "tmp",
                    "mountPath": "/tmp"
                  },
                  {
                    "name": "wafconfig",
                    "mountPath": "/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf",
                    "subPath": "REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf",
                    "readOnly": true
                  },
                  {
                    "name": "wafconfig",
                    "mountPath": "/etc/nginx/templates/includes/proxy_backend.conf.template",
                    "subPath": "proxy_backend.conf.template",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "tmp",
                "emptyDir": {}
              },
              {
                "name": "wafconfig",
                "configMap": {
                  "name": "waf-config"
                }
              }
            ]
          }
        },
        "strategy": {
          "type": "RollingUpdate",
          "rollingUpdate": {
            "maxUnavailable": 0,
            "maxSurge": 1
          }
        },
        "minReadySeconds": 5
      }
    },
